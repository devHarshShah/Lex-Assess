name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGION: asia-south1
  SERVICE: lex-assess-backend
  REPOSITORY: lex-assess

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here - pnpm/action-setup@v4 reads it from the root
      # package.json's `packageManager` field. Pinning both caused a hard
      # "Multiple versions of pnpm specified" failure on every CI run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm@11.8.0 (pinned in packageManager) requires Node >=22.13.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # check-types/lint/test all need the generated Prisma client's types;
      # a placeholder DATABASE_URL is enough since generate doesn't connect.
      - name: Generate Prisma client
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: pnpm --filter backend exec prisma generate

      - run: pnpm check-types

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
        run: |
          docker build -f apps/backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Run database migrations
        run: |
          gcloud run jobs deploy lex-assess-migrate \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --command="node" \
            --args="node_modules/prisma/build/index.js,migrate,deploy" \
            --memory=512Mi \
            --service-account "${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ secrets.GCP_SQL_CONNECTION_NAME }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --execute-now \
            --wait

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: >-
            --service-account=${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ secrets.GCP_SQL_CONNECTION_NAME }}
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --cpu=1
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest
            RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest
            SMTP_PASS=SMTP_PASS:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
          env_vars: |
            FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN }}
            COOKIE_SECURE=true
            COOKIE_SAMESITE=none
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
            GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
            STORAGE_PROVIDER=gcs
            GCS_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
            RAZORPAY_KEY_ID=${{ vars.RAZORPAY_KEY_ID }}
            RAZORPAY_PLAN_ID=${{ vars.RAZORPAY_PLAN_ID }}
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=${{ vars.SMTP_PORT }}
            SMTP_USER=${{ vars.SMTP_USER }}
            SMTP_SECURE=${{ vars.SMTP_SECURE }}
            SMTP_FROM=${{ vars.SMTP_FROM }}
