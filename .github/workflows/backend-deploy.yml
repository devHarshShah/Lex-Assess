name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for redeploys that carry no code change - rotating a secret
  # does nothing to a running revision, since Cloud Run resolves `:latest` at
  # deploy time and pins it. Avoids having to push an empty commit.
  workflow_dispatch:

env:
  REGION: asia-south1
  SERVICE: lex-assess-backend
  REPOSITORY: lex-assess

# The deploy half is split into three dependent jobs (build -> migrate -> deploy)
# rather than one monolith so that GitHub's "Re-run failed jobs" resumes at the
# first thing that actually broke instead of replaying the whole pipeline. The
# build job is additionally a no-op when the image for this SHA is already in
# Artifact Registry, so a retry costs seconds rather than minutes.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here - pnpm/action-setup@v4 reads it from the root
      # package.json's `packageManager` field. Pinning both caused a hard
      # "Multiple versions of pnpm specified" failure on every CI run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm@11.8.0 (pinned in packageManager) requires Node >=22.13.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # check-types/lint/test all need the generated Prisma client's types;
      # a placeholder DATABASE_URL is enough since generate doesn't connect.
      - name: Generate Prisma client
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: pnpm --filter backend exec prisma generate

      - run: pnpm check-types

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  build:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Job-level `env:` can't read the `env` context, so the image ref is
      # assembled here and exported for the remaining steps in this job.
      - name: Resolve image ref
        run: |
          echo "IMAGE=${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${{ github.sha }}" >> "$GITHUB_ENV"

      # Images are immutable per commit SHA, so if this tag is already pushed
      # there is nothing to rebuild - this is what makes `gh run rerun --failed`
      # cheap after a migrate/deploy failure.
      - name: Check whether the image already exists
        id: check
        run: |
          if gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            echo "image already present, skipping build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Docker for Artifact Registry
        if: steps.check.outputs.exists != 'true'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push image
        if: steps.check.outputs.exists != 'true'
        run: |
          docker build -f apps/backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  migrate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Prisma is invoked through its real JS entrypoint rather than the pnpm
      # or .bin shim: the runtime image has no workspace manifest, so corepack
      # would try to reinstall the whole dependency tree and OOM the job.
      #
      # Connectivity is Direct VPC egress to the instance's private IP, not the
      # /cloudsql Unix socket - see the note in infra/terraform/network.tf.
      - name: Run database migrations
        run: |
          gcloud run jobs deploy lex-assess-migrate \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --command="node" \
            --args="node_modules/prisma/build/index.js,migrate,deploy" \
            --memory=512Mi \
            --service-account "${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="" \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --execute-now \
            --wait

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          # private-ranges-only (not all-traffic): the DB is reached over RFC1918
          # via the VPC, while SMTP/Razorpay/Google APIs keep egressing straight
          # to the internet, so no Cloud NAT is needed.
          flags: >-
            --service-account=${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}
            --allow-unauthenticated
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --cpu=1
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest
            RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest
            SMTP_PASS=SMTP_PASS:latest
            EMAIL_WORKER_SECRET=EMAIL_WORKER_SECRET:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
            GOOGLE_CALENDAR_REFRESH_TOKEN=GOOGLE_CALENDAR_REFRESH_TOKEN:latest
          env_vars: |
            FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN }}
            COOKIE_SECURE=true
            COOKIE_SAMESITE=none
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
            GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
            STORAGE_PROVIDER=gcs
            GCS_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
            RAZORPAY_KEY_ID=${{ vars.RAZORPAY_KEY_ID }}
            RAZORPAY_PLAN_ID=${{ vars.RAZORPAY_PLAN_ID }}
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=${{ vars.SMTP_PORT }}
            SMTP_USER=${{ vars.SMTP_USER }}
            SMTP_SECURE=${{ vars.SMTP_SECURE }}
            SMTP_FROM=${{ vars.SMTP_FROM }}
            API_PUBLIC_URL=${{ vars.API_PUBLIC_URL }}
            EMAIL_BATCH_SIZE=40
            EMAIL_MAX_PER_HOUR=40
            EMAIL_MAX_PER_DAY=250

  # Seeds the Media & Entertainment paper. Runs after `deploy` because the
  # 'Media and Entertainment' category is created by PrismaService at app boot
  # and the seed script looks it up rather than creating it. The script is
  # idempotent (skips when the paper already exists and never rebuilds one that
  # has attempts), so running it on every deploy is safe. Deliberately not
  # seed-all: that rebuilds every paper's questions and is unsafe once real
  # attempts exist (see DEPLOYMENT.md, section 7).
  seed:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Seed Media & Entertainment paper
        run: |
          gcloud run jobs deploy lex-assess-seed-media \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --command="node" \
            --args="dist/src/scripts/seed-media-entertainment.js" \
            --memory=512Mi \
            --task-timeout=300s \
            --service-account "${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="" \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --execute-now \
            --wait
